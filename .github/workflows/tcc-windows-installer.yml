
name: Build Traderefy Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/tcc-windows-installer.yml'

jobs:
  windows-installer:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify project structure
        run: |
          $requiredFiles = @(
            "frontend/package.json",
            "backend/requirements.txt",
            "desktop/tcc.spec",
            "desktop/installer.iss"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Required file missing: $file"
            }
          }

          Write-Host "Project structure verified."

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend dependency installation failed."
          }

          if (!(Test-Path "node_modules/.bin/craco.cmd")) {
            throw "CRACO executable not found after npm install."
          }

          Write-Host "Frontend dependencies installed."

      - name: Build React frontend
        working-directory: frontend
        env:
          REACT_APP_API_URL: ''
          CI: 'false'
        run: |
          npm run build

          if ($LASTEXITCODE -ne 0) {
            throw "React frontend build failed."
          }

          if (!(Test-Path "build/index.html")) {
            throw "React build output not found."
          }

          Write-Host "React frontend built successfully."

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip

          if ($LASTEXITCODE -ne 0) {
            throw "Pip upgrade failed."
          }

          python -m pip install -r backend/requirements.txt pyinstaller pywebview

          if ($LASTEXITCODE -ne 0) {
            throw "Python dependency installation failed."
          }

          Write-Host "Python dependencies installed."

      - name: R10 TUS pipeline tests (must pass)
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/test_tus_pipeline.py -q
          if ($LASTEXITCODE -ne 0) {
            throw "TUS journal / telemetry tests failed."
          }

      - name: Full backend test suite (reported, non-blocking)
        working-directory: backend
        continue-on-error: true
        run: |
          python -m pytest tests -q

      - name: Build standalone desktop executable
        run: |
          python -m PyInstaller --noconfirm --clean desktop/tcc.spec

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller build failed."
          }

          if (!(Test-Path "dist")) {
            throw "PyInstaller output directory not found."
          }

          Write-Host "Desktop executable build completed."

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed."
          }

      - name: Create Windows installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found."
          }

          & $iscc "desktop\installer.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer compilation failed."
          }

      - name: Verify installer
        run: |
          $installer = "release/Traderefy_Control_Center_Setup.exe"

          if (!(Test-Path $installer)) {
            throw "Windows installer not found."
          }

          $file = Get-Item $installer

          if ($file.Length -le 0) {
            throw "Installer file is empty."
          }

          Write-Host "Installer created successfully:"
          Write-Host $file.FullName
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Traderefy-Control-Center-Windows-Installer
          path: release/Traderefy_Control_Center_Setup.exe
          if-no-files-found: error
          retention-days: 30
